[project]
name = "music-re"
version = "0.1.0"
description = "Audio Reverse Engineering CLI & MCP Server (Demucs + BasicPitch + ADTOF + Librosa)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "mcp[cli]>=1.2.0,<2.0.0",
    "pydantic>=2.7.0",
    "setuptools<72.0.0",
    "soundfile>=0.12.1",
    "mutagen>=1.47.0",
    "pyloudnorm>=0.1.1",
    "numpy>=1.26.0,<2.0.0",
    "scipy>=1.13.0",
    "librosa>=0.10.2.post1",
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "demucs>=4.0.1",
    "basic-pitch[onnx]>=0.3.3",
    "onnxruntime>=1.18.0",
    "pretty-midi>=0.2.10",
    "music21>=9.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
music-re = "music_re.cli:app"
music-re-mcp = "music_re.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
