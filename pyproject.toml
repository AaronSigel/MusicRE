[project]
name = "music-re"
version = "0.1.0"
description = "Audio Reverse Engineering CLI & MCP Server (Demucs + BasicPitch + ADTOF + Librosa)"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "mcp[cli]>=1.2.0,<2.0.0",
    "pydantic>=2.7.0",
    "setuptools<72.0.0",
    "soundfile>=0.12.1",
    "mutagen>=1.47.0",
    "pyloudnorm>=0.1.1",
    "numpy>=1.26.0,<2.0.0",
    "scipy>=1.13.0",
    "librosa>=0.10.2.post1",
    "torch==2.2.2",
    "torchaudio==2.2.2",
    "demucs==4.1.0",
    "basic-pitch[onnx]==0.4.0",
    "onnxruntime>=1.18.0",
    "pretty-midi>=0.2.10",
    "music21>=9.1.0",
    "all-in-one-infer==3.1.0",
    "mir-eval==0.8.2",
    "museval==0.4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
music-re = "music_re.cli:app"
music-re-mcp = "music_re.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = ["models: downloads or loads external model weights", "real_e2e: opt-in acceptance on a real MP3", "dataset: downloads or loads external benchmark datasets (Slakh)"]
